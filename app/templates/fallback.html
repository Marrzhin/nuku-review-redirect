<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kartu belum aktif</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #fafafa; color: #1a1a1a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 24rem; text-align: center; background: #fff;
    border-radius: 16px; padding: 32px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,.08);
  }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  p { margin: 0 0 20px; line-height: 1.6; color: #555; font-size: .9375rem; }
  .wa {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; padding: 13px 18px; border-radius: 10px;
    background: #1fa855; color: #fff; text-decoration: none;
    font-size: .9375rem; font-weight: 600;
  }
  .wa:hover { background: #17924a; }
  .wa:focus-visible { outline: 3px solid #1fa855; outline-offset: 2px; }
  .wa svg { width: 19px; height: 19px; fill: currentColor; flex: none; }
  .kode {
    display: inline-block; margin-top: 18px; padding: 3px 10px; border-radius: 6px;
    background: #f0f0f0; color: #777;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .75rem;
    letter-spacing: .04em;
  }
  .brand {
    margin-top: 22px; font-size: .75rem; letter-spacing: .08em;
    text-transform: uppercase; color: #999;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #f0f0f0; }
    .card { background: #1e1e1e; box-shadow: none; }
    p { color: #b0b0b0; }
    .kode { background: #2a2a2a; color: #8a8a8a; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Kartu belum aktif</h1>
    <p>{{ pesan }}</p>

    {% if wa_url %}
    <a class="wa" href="{{ wa_url }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.65-2.05-.17-.3-.02-.46.13-.6.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.01-1.04 2.47s1.06 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.28.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.5h-.01a9.42 9.42 0 0 1-4.8-1.32l-.34-.2-3.57.94.95-3.48-.22-.36a9.4 9.4 0 0 1-1.44-5.02c0-5.2 4.23-9.43 9.44-9.43a9.37 9.37 0 0 1 6.67 2.77 9.34 9.34 0 0 1 2.76 6.67c0 5.2-4.24 9.43-9.44 9.43zM20.13 3.9A11.32 11.32 0 0 0 12.05.55C5.79.55.7 5.64.7 11.9c0 2 .52 3.95 1.52 5.67L.6 23.45l6.02-1.58a11.3 11.3 0 0 0 5.42 1.38h.01c6.26 0 11.35-5.09 11.35-11.35 0-3.03-1.18-5.88-3.32-8.02z"/></svg>
      Hubungi lewat WhatsApp
    </a>
    {% endif %}

    {% if kode %}<span class="kode">{{ kode }}</span>{% endif %}
    <div class="brand">Nuku Creative Studio</div>
  </div>
</body>
</html>
