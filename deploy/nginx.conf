# Sudah terpasang di VPS sebagai /etc/nginx/sites-available/go.nukustudio.id.
# Disimpan di repo supaya versinya terlacak.
#
# Catatan Cloudflare: record "go" sengaja DNS-only (abu-abu), karena SSL zona
# nukustudio.id memakai mode Flexible. Kalau proxy Cloudflare diaktifkan untuk
# subdomain ini, mode SSL-nya HARUS Full (strict) — Flexible akan menyebabkan
# redirect loop dengan blok redirect 80 -> 443 di bawah.

server {
    listen 80;
    listen [::]:80;
    server_name go.nukustudio.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name go.nukustudio.id;

    ssl_certificate     /etc/letsencrypt/live/go.nukustudio.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go.nukustudio.id/privkey.pem;

    access_log /var/log/nginx/go.nukustudio.id.access.log;
    error_log  /var/log/nginx/go.nukustudio.id.error.log;

    # Endpoint admin sudah dilindungi X-Admin-Key. Kalau mau lapisan kedua,
    # buka blok ini dan isi IP kantor/rumah. Taruh SEBELUM "location /".
    # location /admin/ {
    #     allow 203.0.113.10;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
